services:
  - type: web
    name: mma-ticket
    region: oregon
    plan: free
    env: php
    buildCommand: |
      composer install --no-dev --worker-dir
      npm install
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      touch database/database.sqlite
      php artisan migrate --force
      php artisan storage:link
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://mma-ticket.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: FILESYSTEM_DRIVER
        value: public
      - key: LOG_CHANNEL
        value: stderr
